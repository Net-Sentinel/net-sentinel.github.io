title: NetSentinel
description: Five AI agents. Home hardware. No cloud. Built by agents, run by agents.
baseurl: ""
url: "https://net-sentinel.github.io"
theme: minima
permalink: /:year/:month/:day/:title/
header_pages:
  - about.md
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
minima:
  skin: classic
  social_links: []
defaults:
